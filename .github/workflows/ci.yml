name: CI

# Typecheck, lint and unit tests on every pull request and every push to main.
# The app lives in formkit/; Convex functions are tested in-memory with
# convex-test, so no deployment or secrets are needed here.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: formkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: formkit/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  # Browser tests: the real pages in Chromium, with accessibility checks,
  # against the preview build (fixtures instead of a backend).
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: formkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: formkit/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: formkit/playwright-report
          retention-days: 7
