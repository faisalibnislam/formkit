<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/formkit-design-system-e346e922-3f90-435e-ac92-f39661fade4f/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/formkit-design-system-e346e922-3f90-435e-ac92-f39661fade4f/tokens/colors.css">
  <link rel="stylesheet" href="_ds/formkit-design-system-e346e922-3f90-435e-ac92-f39661fade4f/tokens/typography.css">
  <link rel="stylesheet" href="_ds/formkit-design-system-e346e922-3f90-435e-ac92-f39661fade4f/tokens/radius.css">
  <link rel="stylesheet" href="_ds/formkit-design-system-e346e922-3f90-435e-ac92-f39661fade4f/tokens/shadows.css">
  <link rel="stylesheet" href="_ds/formkit-design-system-e346e922-3f90-435e-ac92-f39661fade4f/tokens/base.css">
  <link rel="stylesheet" href="_ds/formkit-design-system-e346e922-3f90-435e-ac92-f39661fade4f/styles.css">
  <script src="./fk-icons.js"></script>
  <script src="_ds/formkit-design-system-e346e922-3f90-435e-ac92-f39661fade4f/_ds_bundle.js"></script>
  <style>
    [data-fknav] a{text-decoration:none;border-bottom:none;padding-bottom:0}
    @media (max-width:980px){[data-fknav-links]{display:none!important}}
    @media (max-width:560px){[data-fknav]{top:14px!important;height:54px!important}}
  </style>
</helmet>

<header data-fknav="true" style="position:fixed;top:29px;left:50%;transform:translateX(-50%);z-index:80;display:flex;align-items:center;gap:6px;width:calc(100% - (clamp(10px,1.5vw,20px) + 12px) * 2);height:60px;padding:0 8px;border-radius:var(--radius-pill);background:var(--neutral-950);box-shadow:0 18px 40px -26px rgba(33,40,46,.9);backdrop-filter:blur(14px);font-family:var(--font-sans);transition:width .45s cubic-bezier(.22,.8,.24,1),top .45s cubic-bezier(.22,.8,.24,1),transform .45s cubic-bezier(.22,.8,.24,1)">
  <a href="Formkit Landing.dc.html" aria-label="Formkit — form builder" style="display:inline-flex;align-items:center;height:44px;padding:0 12px 0 10px;border-radius:var(--radius-pill);color:#ffffff">
    <x-import component-from-global-scope="FormkitDesignSystem_e346e9.Logo" size="{{ n19 }}" tone="current" hint-size="100px,20px"></x-import>
  </a>
  <nav data-fknav-links="true" aria-label="Sections" style="position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:2px">
    <sc-for list="{{ links }}" as="l" hint-placeholder-count="6">
      <a href="{{ l.href }}" style="{{ l.style }}" style-hover="background:rgba(255,255,255,.14);color:#ffffff">{{ l.label }}</a>
    </sc-for>
  </nav>
  <span style="flex:1"></span>
  <sc-if value="{{ signedIn }}" hint-placeholder-val="{{ false }}">
    <span style="position:relative">
      <button type="button" onClick="{{ toggleMenu }}" aria-haspopup="menu" aria-expanded="{{ menuOpen }}" aria-label="Account menu" style="display:inline-flex;align-items:center;gap:9px;height:44px;padding:0 12px 0 5px;border:none;border-radius:var(--radius-pill);background:rgba(255,255,255,.12);color:#ffffff;font:inherit;font-size:14px;cursor:pointer" style-hover="background:rgba(255,255,255,.2)">
        <span style="display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;flex:0 0 auto;border-radius:50%;background:#ffffff;color:var(--neutral-900);font-size:13px;font-weight:600">{{ initials }}</span>
        <span style="max-width:14ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ acName }}</span>
        <span style="{{ caretStyle }}">
          <x-import component-from-global-scope="FormkitDesignSystem_e346e9.Icon" name="chevron-down" size="{{ n15 }}" hint-size="15px,15px"></x-import>
        </span>
      </button>
      <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
        <span role="menu" style="position:absolute;top:calc(100% + 10px);right:0;min-width:230px;display:flex;flex-direction:column;padding:8px;border-radius:18px;background:var(--neutral-0);box-shadow:var(--shadow-float);z-index:90">
          <span style="display:block;padding:8px 12px 10px">
            <span style="display:block;font-size:14.5px;font-weight:500;color:var(--neutral-900)">{{ acName }}</span>
            <span style="display:block;font-size:12.5px;color:var(--color-text-tertiary);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ acEmail }}</span>
          </span>
          <span style="display:block;height:1px;background:var(--neutral-200);margin:2px 8px 6px"></span>
          <a href="Formkit Main App.dc.html" role="menuitem" style="display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;font-size:14.5px;color:var(--neutral-900)" style-hover="background:var(--neutral-100);color:var(--neutral-900)">
            <x-import component-from-global-scope="FormkitDesignSystem_e346e9.Icon" name="layout-grid" size="{{ n16 }}" hint-size="16px,16px"></x-import>
            Dashboard
          </a>
          <a href="Formkit Help.dc.html" role="menuitem" style="display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;font-size:14.5px;color:var(--neutral-900)" style-hover="background:var(--neutral-100);color:var(--neutral-900)">
            <x-import component-from-global-scope="FormkitDesignSystem_e346e9.Icon" name="life-buoy" size="{{ n16 }}" hint-size="16px,16px"></x-import>
            Help center
          </a>
          <span style="display:block;height:1px;background:var(--neutral-200);margin:6px 8px"></span>
          <button type="button" role="menuitem" onClick="{{ onSignOut }}" style="display:flex;align-items:center;gap:11px;padding:10px 12px;border:none;border-radius:12px;background:transparent;font:inherit;font-size:14.5px;color:var(--red-600);text-align:left;cursor:pointer" style-hover="background:var(--red-100)">
            <x-import component-from-global-scope="FormkitDesignSystem_e346e9.Icon" name="log-out" size="{{ n16 }}" hint-size="16px,16px"></x-import>
            Log out
          </button>
        </span>
      </sc-if>
    </span>
  </sc-if>
  <sc-if value="{{ signedOut }}" hint-placeholder-val="{{ true }}">
    <a href="Formkit Main App.dc.html?view=signin" style="display:inline-flex;align-items:center;height:40px;padding:0 16px;margin-right:4px;border-radius:var(--radius-pill);font-size:14px;color:#ffffff;transition:background .2s ease" style-hover="background:rgba(255,255,255,.14);color:#ffffff">Sign in</a>
    <a href="Formkit Main App.dc.html?view=signup" style="display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 20px;border-radius:var(--radius-pill);background:#ffffff;color:var(--neutral-900);font-size:14.5px;font-weight:500">Sign up</a>
  </sc-if>
</header>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:120},&quot;current&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;&quot;,&quot;options&quot;:[&quot;&quot;,&quot;builder&quot;,&quot;logic&quot;,&quot;form&quot;,&quot;responses&quot;,&quot;analytics&quot;,&quot;help&quot;],&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { menuOpen: false };

  componentDidMount() {
    // At rest the bar spans the page; scrolling narrows it to the content grid.
    const bar = () => (document.querySelector('#dc-root') || document).querySelector('[data-fknav]');
    let narrow = null;
    // A page can mark sections the bar must not cover (pinned scenes, the
    // footer) with data-nav-hide; the bar lifts away while one is under it.
    let hidden = null;
    this.onScroll = () => {
      const el = bar();
      if (!el) return;
      const want = window.scrollY > 60;
      if (want !== narrow) {
        narrow = want;
        el.style.width = want ? 'min(1200px,calc(100% - clamp(24px,5vw,56px)))' : 'calc(100% - (clamp(10px,1.5vw,20px) + 12px) * 2)';
        el.style.top = want ? '14px' : '29px';
      }
      // The guard is the bar's RESTING footprint, never its live rect: reading
      // the live rect while hidden collapses the test and lets the bar settle
      // back on top of the very section it is avoiding.
      const guard = (want ? 14 : 29) + el.offsetHeight + 12;
      // At the very top the bar always shows, even over a marked hero.
      const over = window.scrollY > 60 && Array.prototype.slice.call(document.querySelectorAll('[data-nav-hide]'))
        .some(sec => { const r = sec.getBoundingClientRect(); return r.top < guard && r.bottom > 0; });
      if (over === hidden) return;
      hidden = over;
      el.style.transform = over ? 'translateX(-50%) translateY(calc(-100% - 40px))' : 'translateX(-50%)';
    };
    window.addEventListener('scroll', this.onScroll, { passive: true });
    window.addEventListener('resize', this.onScroll);
    this.onScroll();

    this.onDoc = e => {
      if (!this.state.menuOpen) return;
      const root = document.querySelector('#dc-root') || document;
      const bar = root.querySelector('[data-fknav]');
      if (bar && !bar.contains(e.target)) this.setState({ menuOpen: false });
    };
    this.onKey = e => { if (e.key === 'Escape') this.setState({ menuOpen: false }); };
    document.addEventListener('pointerdown', this.onDoc);
    document.addEventListener('keydown', this.onKey);
  }
  componentWillUnmount() {
    document.removeEventListener('pointerdown', this.onDoc);
    document.removeEventListener('keydown', this.onKey);
    window.removeEventListener('scroll', this.onScroll);
    window.removeEventListener('resize', this.onScroll);
  }

  /* The app's own saved state is the single source of who is signed in. */
  account() {
    try {
      const raw = localStorage.getItem('formkit.state.v5');
      if (!raw) return null;
      const st = JSON.parse(raw) || {};
      const f = st.fset || {};
      return { name: f.acName || 'Your account', email: f.acEmail || '' };
    } catch (e) { return null; }
  }

  signOut() {
    // Clear the session the app reads, then land on the public site.
    try { localStorage.removeItem('formkit.state.v5'); } catch (e) {}
    window.location.href = 'Formkit Landing.dc.html';
  }

  renderVals() {
    const acct = this.account();
    const signedIn = !!acct;
    const name = acct ? acct.name : '';
    const initials = name.split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('') || 'FK';
    const base = 'display:inline-flex;align-items:center;height:40px;padding:0 12px;border-radius:var(--radius-pill);font-size:13.5px;letter-spacing:.01em;white-space:nowrap;color:';
    const here = this.props.current || '';
    return {
      n15: 15, n16: 16, n19: 19,
      signedIn, signedOut: !signedIn,
      acName: name, acEmail: acct ? acct.email : '', initials,
      menuOpen: this.state.menuOpen,
      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),
      onSignOut: () => this.signOut(),
      caretStyle: 'display:inline-flex;transition:transform .2s ease;transform:rotate(' + (this.state.menuOpen ? 180 : 0) + 'deg)',
      links: [
        { id: 'builder', label: 'Product', href: 'Formkit Landing.dc.html#ask' },
        { id: 'templates', label: 'Templates', href: 'Formkit Templates.dc.html' },
        { id: 'pricing', label: 'Pricing', href: 'Formkit Pricing.dc.html' },
        { id: 'compare', label: 'Compare', href: 'Formkit Compare.dc.html' },
        { id: 'help', label: 'Help center', href: 'Formkit Help.dc.html' }
      ].map(l => Object.assign({}, l, {
        style: base + (l.id === here ? '#ffffff' : 'rgba(255,255,255,.86)')
          + (l.id === here ? ';background:rgba(255,255,255,.14)' : '')
      }))
    };
  }
}

</script>
</body>
</html>
