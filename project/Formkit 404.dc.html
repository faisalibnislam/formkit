  <style>
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{background:var(--paper);color:var(--neutral-900);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}
    a{color:var(--blue-700);text-decoration:none;border-bottom:none;padding-bottom:0}
    a:hover{color:var(--neutral-900)}

    @media (max-width:560px){[data-page] > section a{width:100%;justify-content:center}}
  </style>
</helmet>

<div data-page="true" style="min-height:100vh;display:flex;flex-direction:column;background:var(--paper);font-family:var(--font-sans);color:var(--neutral-900);padding:var(--fk-gap) 0">

  <dc-import name="Formkit Nav" hint-size="100%,60px"></dc-import>

  <section style="position:relative;flex:1;background:#0a3d6f;color:#ffffff;padding:calc(104px + clamp(28px,6vw,64px)) clamp(20px,5vw,56px) clamp(56px,8vw,96px);display:flex;align-items:center">

    <div style="position:relative;z-index:1;width:100%;max-width:820px;margin:0 auto;text-align:center">
      <span style="font-size:11.5px;letter-spacing:.16em;color:rgba(255,255,255,.7)">404</span>
      <h1 style="margin:16px 0 0;font-size:clamp(32px,5.2vw,62px);font-weight:700;letter-spacing:-.04em;line-height:1.02;color:#ffffff">This page has no answers.</h1>
      <p style="margin:18px auto 0;max-width:48ch;font-size:16.5px;line-height:1.6;color:#ffffff;opacity:.86;text-wrap:pretty">The link is wrong, or the page moved. If you were opening someone's form, check the address against the one they sent — a changed handle or slug is the usual cause.</p>

      <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:30px">
        <a href="Formkit Landing.dc.html" style="display:inline-flex;align-items:center;gap:9px;height:50px;padding:0 24px;border-radius:var(--radius-pill);background:#ffffff;color:var(--neutral-900);font-size:15.5px;font-weight:500">
          Formkit home
          <x-import component-from-global-scope="FormkitDesignSystem_e346e9.Icon" name="arrow-right" size="{{ n17 }}" hint-size="17px,17px"></x-import>
        </a>
        <a href="Formkit Help.dc.html" style="display:inline-flex;align-items:center;height:50px;padding:0 22px;border-radius:var(--radius-pill);color:#ffffff;font-size:15.5px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)" style-hover="background:rgba(255,255,255,.14);color:#ffffff">Search the help center</a>
      </div>

      <div style="margin-top:clamp(36px,5vw,56px);padding-top:clamp(24px,3vw,36px);box-shadow:inset 0 1px 0 rgba(255,255,255,.2)">
        <div style="font-size:11.5px;letter-spacing:.14em;color:rgba(255,255,255,.55)">TRY ONE OF THESE</div>
        <div style="display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-top:16px">
          <sc-for list="{{ links }}" as="l" hint-placeholder-count="6">
            <a href="{{ l.href }}" style="display:inline-flex;align-items:center;height:38px;padding:0 17px;border-radius:var(--radius-pill);background:rgba(255,255,255,.14);color:#ffffff;font-size:14px" style-hover="background:rgba(255,255,255,.24);color:#ffffff">{{ l.label }}</a>
          </sc-for>
        </div>
      </div>
    </div>
  </section>

  <dc-import name="Formkit Footer" hint-size="100%,760px"></dc-import>
</div>
